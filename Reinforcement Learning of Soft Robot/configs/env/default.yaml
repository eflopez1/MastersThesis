# Default environment: Obstacle Field task, Multiagent control timing, legacy *effective* dynamics in SI.
# Every value below equals the dataclass default; it is written out so experiments are self-documenting.
env:
  body:
    num_bots: 10
    bot_radius: 0.025          # m
    bot_mass: 0.15             # kg
    skin_ratio: 2              # passive units between consecutive bots
    skin_radius: 0.015         # m
    skin_mass: 0.075           # kg
    initial_gap: 0.015         # m, surface gap along the ring at reset (legacy = skin_radius)
    interior_radius: 0.025     # m ("sand")
    interior_mass: 0.0005      # kg
    interior_ring_gap: 6.6667e-6  # m (legacy runtime: 0.001 px)
    percent_interior_remove: 0.0
    membrane_friction: 0.5
    interior_friction: 0.5
    max_separation_ratio: 0.875   # SlideJoint max = 0.875 x sand diameter (legacy 1.75 x inRadius)
    spring_rest_length: 0.0    # m
    spring_stiffness: 1.0      # nominal N/m (x sim.force_scale)
    spring_damping: 1.0        # N s/m (not scaled; legacy never converted it)
  sim:
    dt: 0.005                  # s
    substeps: 50               # control step = 0.25 s (Multiagent timing)
    force_scale: 0.0066667     # 1/150: reproduces legacy effective forces. Use 1.0 for nominal SI.
    iterations: 10
    collision_slop: 0.00066667 # m (legacy default 0.1 px)
    max_speed: 5.0             # m/s, numerical-failure threshold
    separation_tolerance: 0.05 # link stretch > (1+tol) x max_separation => failure
  actuation:
    max_force: 2.0             # nominal N per axis (x sim.force_scale)
  ground:
    enabled: true
    friction_mu: 0.2
    gravity: 9.81
    rotational_contact_radius: 0.0066667
  arena:
    width: 9.2133               # m (1382 px / 150)
    height: 5.18                # m (777 px / 150)
    wall_thickness: 0.0125
    wall_friction: 0.0
    target_distance_in_R: 25.0  # Obstacle Field
  obstacles:
    enabled: true
    shape: star
    outer_radius_in_R: 2.0
    inner_ratio: 0.5
    segment_radius: 0.033333
    min_spacing_in_R: 4.5
    poisson_k: 30
    friction: 0.5
    enforce_start_clearance: true   # deviation from legacy: prevents initial interpenetration
    start_clearance_margin: 0.02
  observation:
    include_absolute_position: false
    role_encoding: none          # none | one_hot | ring_angle
    contact_window: any_substep  # any_substep | last_substep
    contact_includes_walls: true
    velocity_scale: 0.25         # m/s
    clip: 10.0
    actor_global: []             # e.g. [shape_radial] or [contact_map] for ablations
    contact_normal: true         # +2 dims: unit direction from touched obstacle/wall to the bot
    range_sensors: false         # +range_num_rays dims: normalised free distance per ray (1 = nothing in range)
    range_num_rays: 8
    range_max_in_R: 1.0          # ray length beyond the bot surface
    range_includes_walls: true
  descriptors:
    shape_sectors: 8
    shape_units: membrane
    orientation: world
    fourier_harmonics: 6
    contact_sectors: 5
  reward:
    progress_weight: 2000.0      # legacy Obstacle Field, per metre of progress
    clip_negative_progress: true # legacy: no penalty for moving away
    finish_line_margin_in_R: 2.0 # success = centroid crosses x = target_x - margin (legacy "passed target")
    success_bonus: 5.0           # legacy finish-line bonus
    timeout_penalty: -10.0
    failure_penalty: -10.0       # hypothesis; must be <= timeout_penalty to avoid "fail early" exploits
    contact_penalty_weight: 0.0  # ablation knob (see configs/env/contact_penalty.yaml)
    contact_penalty_includes_walls: true
    control_effort_weight: 0.0
    deformation_penalty_weight: 0.0
  episode:
    max_time_s: 60.0             # ~3x obstacle-free push time (19.3 s measured); legacy Obstacle Field used 35 s
